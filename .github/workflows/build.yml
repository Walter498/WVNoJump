name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + xz
        run: |
          brew install ldid xz || true
          if ! command -v ldid >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            curl -fL -o "$HOME/bin/ldid" \
              https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            chmod +x "$HOME/bin/ldid"
            codesign -s - -f "$HOME/bin/ldid" || true
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          ldid -v || true

      - name: Setup Theos + SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build (rootless scheme)
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0

      - name: Make arm64e variant
        run: |
          set -e
          SRC=$(find "$PWD" -name "*.deb" | head -1)
          echo "built: $SRC"
          mkdir -p out
          cp "$SRC" out/
          WORK=$(mktemp -d)
          cp "$SRC" "$WORK/pkg.deb"
          cd "$WORK"
          ar x pkg.deb
          mkdir ctl && tar xf control.tar.* -C ctl
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64e/' ctl/control
          grep -i '^Architecture' ctl/control
          rm -f control.tar.*
          (cd ctl && tar -czf ../control.tar.gz .)
          DATA=$(ls data.tar.*)
          rm -f new.deb
          ar rc new.deb debian-binary control.tar.gz "$DATA"
          NEWNAME=$(basename "$SRC" | sed 's/_iphoneos-arm64\.deb$/_iphoneos-arm64e.deb/')
          cp new.deb "$OLDPWD/out/$NEWNAME"
          ls -la "$OLDPWD/out"

      - name: Verify debs
        run: |
          for f in out/*.deb; do echo "== $f"; ar t "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: WVNoJump-debs
          path: out/*.deb
