name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + xz
        run: |
          brew install ldid xz || true
          if ! command -v ldid >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            curl -fL -o "$HOME/bin/ldid" \
              https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            chmod +x "$HOME/bin/ldid"
            codesign -s - -f "$HOME/bin/ldid" || true
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          ldid -v || true

      - name: Setup Theos + SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      # 现代 Theos 的 rootless stub 把依赖写成 @rpath/CydiaSubstrate.framework/CydiaSubstrate，
      # 而 ElleKit / roothide bootstrap 只提供 usr/lib/libsubstrate.dylib（没有那个 framework）。
      # 原版 WTVRBGLauncher 用的正是 @loader_path/.jbroot/usr/lib/libsubstrate.dylib，
      # 这里把 stub 的 install-name 改掉，让依赖与之一致。
      - name: Align substrate install-name (rootless stub)
        run: |
          TBD="$HOME/theos/vendor/lib/iphone/rootless/CydiaSubstrate.framework/CydiaSubstrate.tbd"
          if [ -f "$TBD" ]; then
            sed -i '' "s|^install-name:.*|install-name:    '@loader_path/.jbroot/usr/lib/libsubstrate.dylib'|" "$TBD"
            grep -n "install-name" "$TBD"
          else
            echo "::warning::找不到 rootless substrate stub，依赖可能仍是 CydiaSubstrate.framework"
          fi

      - name: Build (rootless scheme, arm64 + arm64e)
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 DEBUG=0

      - name: Verify dependency + build variants
        run: |
          set -e
          SRC=$(find "$PWD" -name "*.deb" | head -1)
          DYLIB=$(find "$PWD" -name "*.dylib" | head -1)
          echo "deb   : $SRC"
          echo "dylib : $DYLIB"
          echo "----- otool -L -----"
          otool -L "$DYLIB"
          otool -L "$DYLIB" | grep -q "libsubstrate.dylib" || {
            echo "::error::substrate 依赖没对齐（仍是 CydiaSubstrate.framework）"; exit 1; }

          mkdir -p out/jbroot-arm64e out/rootless-arm64 out/nojbroot-arm64e
          BASE=$(basename "$SRC")
          # 1) /var/jb 前缀 + iphoneos-arm64e（最贴近用户设备的形态）
          python3 tools/repack.py "$SRC" "out/jbroot-arm64e/$BASE" --arch iphoneos-arm64e
          # 2) 原样：/var/jb 前缀 + iphoneos-arm64（标准 rootless）
          cp "$SRC" "out/rootless-arm64/$BASE"
          # 3) 去掉 /var/jb 前缀 + iphoneos-arm64e（roothide 布局，与原版 deb 完全一致）
          python3 tools/repack.py "$SRC" "out/nojbroot-arm64e/$BASE" \
            --arch iphoneos-arm64e --strip-prefix var/jb

          find out -type f | sort

      - name: Verify debs
        run: |
          for f in $(find out -name "*.deb"); do
            echo "== $f"
            ar t "$f"
            echo "   arch: $(python3 - <<PY
import sys
sys.path.insert(0, 'tools')
from repack import ar_read
import tarfile, io
for n, b in ar_read("$f"):
    if n.startswith('control.tar'):
        tf = tarfile.open(fileobj=io.BytesIO(b), mode='r:gz')
        for m in tf.getmembers():
            if m.name.endswith('control'):
                print([l for l in tf.extractfile(m).read().decode().splitlines() if l.startswith('Architecture')][0])
PY
)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: WVNoJump-debs
          path: out/**/*.deb
